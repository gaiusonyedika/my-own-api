name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    - name: Install dependenices
      run: npm install

    - name: Run tests
      run: npm test --if-present

    - name: Check app starts
      run: |
        timeout 5 npm start & 
        sleep 3
        curl --fail http://localhost:3000/ || echo "App check done"
@' | Set-Content -Path .github\workflows\ci.yml
