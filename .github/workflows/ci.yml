name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    run-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm install
      - name: Test (allow no tests yet)
        run: npm test --if-present || echo "No tests - OK"
      - name: Build check
        run: node --check src/app.js && node --check src/server.js && echo "Syntax OK"
